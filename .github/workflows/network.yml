name: Network tests

# Live requests to upstream data services; scheduled so API changes are caught without
# making push/PR CI depend on external availability.
on:
  schedule:
  - cron: 0 12 * * 1
  workflow_dispatch:

jobs:
  test-network:
    name: network - test314, ubuntu-latest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.9.4
      with:
        pixi-version: v0.67.0
        environments: test314
        activate-environment: test314
    - name: Run network tests
      run: pixi r test-network
      env:
        EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
        EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
